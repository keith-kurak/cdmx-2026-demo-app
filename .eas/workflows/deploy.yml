name: Deploy iOS and Android (store or OTA)

# Push to main ships both platforms. Each platform decides on its own: native
# changes create a new store binary (TestFlight on iOS, the Play internal
# testing track on Android). JS-only changes publish an EAS Update to the
# `production` channel, which every installed build with the same fingerprint
# picks up. Store binaries are never repacked. See README.md#store-builds-and-ota-updates.

on:
  push:
    branches: ['main']
  # Lets `eas workflow:run` trigger this by hand, which is the only way to
  # exercise it before the GitHub repo is connected to the EAS project.
  workflow_dispatch:
    inputs:
      force_native:
        type: boolean
        default: false
        description: Build and upload new store binaries for both platforms even if compatible builds exist

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  checks:
    name: Type check
    environment: production
    image: sdk-58
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Type check
        run: bun run typecheck

  fingerprint:
    name: Fingerprint native layer
    type: fingerprint
    # Must match the build profile's environment or the hashes will not line up.
    environment: production

  # iOS

  get_ios_build:
    name: Find an OTA-compatible iOS build
    type: get-build
    needs: [checks, fingerprint]
    params:
      platform: ios
      profile: production
      distribution: store
      channel: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # The `fingerprint` runtime policy makes the runtime version the hash.
      runtime_version: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # Only reuse completed builds. An in-progress build may never be uploaded.
      wait_for_in_progress: false

  build_ios:
    name: Build iOS for TestFlight
    type: build
    needs: [get_ios_build]
    if: ${{ inputs.force_native == true || !needs.get_ios_build.outputs.build_id }}
    params:
      platform: ios
      profile: production
      message: ${{ github.commit_message }}

  testflight:
    name: Upload to TestFlight
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: ${{ github.commit_message }}

  publish_ios_update:
    name: Publish iOS OTA update
    type: update
    needs: [get_ios_build]
    if: ${{ inputs.force_native != true && needs.get_ios_build.outputs.build_id }}
    environment: production
    params:
      platform: ios
      channel: production
      message: ${{ github.commit_message }}

  # Android

  get_android_build:
    name: Find an OTA-compatible Android build
    type: get-build
    needs: [checks, fingerprint]
    params:
      platform: android
      profile: production
      distribution: store
      channel: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      runtime_version: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: false

  build_android:
    name: Build Android for Google Play
    type: build
    needs: [get_android_build]
    if: ${{ inputs.force_native == true || !needs.get_android_build.outputs.build_id }}
    params:
      platform: android
      profile: production
      message: ${{ github.commit_message }}

  play_internal:
    name: Upload to Google Play internal testing
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      # The `production` submit profile targets the internal track (eas.json).
      profile: production

  publish_android_update:
    name: Publish Android OTA update
    type: update
    needs: [get_android_build]
    if: ${{ inputs.force_native != true && needs.get_android_build.outputs.build_id }}
    environment: production
    params:
      platform: android
      channel: production
      message: ${{ github.commit_message }}
